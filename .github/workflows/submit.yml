name: Submit to stores

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Check authentication only, do not upload or submit
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: submit
  cancel-in-progress: false

jobs:
  submit:
    # v0.1.0 was submitted to both stores by hand; its tag only creates the release.
    if: github.event_name == 'workflow_dispatch' || github.ref_name != 'v0.1.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run zip:chrome
      - run: bun run zip:firefox
      - run: >-
          bunx wxt submit
          --chrome-zip .output/*-chrome.zip
          --firefox-zip .output/*-firefox.zip
          --firefox-sources-zip .output/*-sources.zip
          ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
