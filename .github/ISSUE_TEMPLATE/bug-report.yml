name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste your testmail.app API key or real email content. Replace them with placeholders.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://api.testmail.app/api/json?apikey=…&namespace=…
        2. Press …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: The version from the store or the release, or the commit hash if you built from `main`.
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Edge
        - Other Chromium browser
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version
      placeholder: '130'
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Errors from the browser console on the testmail.app page, if any.
      render: text
